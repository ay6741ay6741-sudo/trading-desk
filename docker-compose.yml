services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    env_file: .env
    environment:
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: 0.0.0.0  # inside the docker network only; host port below is localhost-only
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./desk:/freqtrade/desk
      - ./state:/freqtrade/state
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8080:8080"  # never exposed to the internet
    command: >
      trade --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json --strategy DeskStrategy

  desk:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    depends_on: [freqtrade]
    env_file: .env
    environment:
      FREQTRADE_API_URL: http://freqtrade:8080
    working_dir: /freqtrade
    entrypoint: ["python", "-m", "desk.desk"]
    volumes:
      - ./user_data:/freqtrade/user_data:ro
      - ./desk:/freqtrade/desk
      - ./state:/freqtrade/state
      - ./reports:/freqtrade/reports
      - /etc/localtime:/etc/localtime:ro
