name: desk
on:
  schedule:
    - cron: "7,27,47 * * * *"  # 3x/hour: a dropped GitHub schedule is covered 20 min later; engine skips candles it already saw
  workflow_dispatch:
concurrency:
  group: desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Desk run (paper only, stdlib python)
        env:
          TZ: America/New_York
        run: python3 -m desk.desk
      - name: Save state and reports
        run: |
          git config user.name "desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports desk/thresholds.json
          git diff --cached --quiet && exit 0
          git commit -q -m "desk run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
