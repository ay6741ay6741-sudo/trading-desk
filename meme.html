<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Boss</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Big Boss">
<meta name="theme-color" content="#1c1d20">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:#1c1d20;color:#f4f4f2;font:16px -apple-system,system-ui,sans-serif;overflow:hidden}
/* iOS sizes iframes to their content unless pinned like this; the app inside then always matches the screen width */
iframe{position:fixed;top:0;left:0;width:1px;min-width:100%;height:100%;border:0;background:#1c1d20}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#msg img{width:64px;height:64px;border-radius:15px}
#msg small{color:#b0b1b6;font-size:14px}
#msg button{min-height:44px;padding:10px 20px;border-radius:12px;border:1px solid #3a3b40;background:#242528;color:#f4f4f2;font:inherit;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#b0b1b6;display:inline-block;margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="msg" role="status" aria-live="polite"><img src="icon-180.png" alt=""><div><span class="dot" aria-hidden="true"></span><span id="txt">Connecting to Big Boss on your PC…</span></div><small id="sub"></small><button type="button" id="retry" hidden>Try again</button></div>
<script>
// The bot runs on the owner's PC behind a Cloudflare quick tunnel whose address changes on restart.
// The PC publishes the current address to bot.json; this page loads the app from it straight away (no waiting on a
// separate health check first) and only shows the offline message if the PC can't be reached.
let current = null, misses = 0, everOk = false;
async function reachable(url) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try { await fetch(url + "/health", {mode: "no-cors", cache: "no-store", signal: ctl.signal}); return true; }
  catch (e) { return false; } finally { clearTimeout(t); }
}
async function connect() {
  try {
    const b = await (await fetch("bot.json?t=" + Date.now(), {cache: "no-store"})).json();
    if (b.url !== current) {
      current = b.url;
      let f = document.querySelector("iframe");
      if (!f) { f = document.createElement("iframe"); f.title = "Big Boss"; document.body.appendChild(f); }
      f.src = b.url + "/phone/";
      f.onload = () => { document.getElementById("msg").style.display = "none"; };
    }
    // one slow check is a tunnel hiccup, not an outage: only swap the app for the offline message after two misses
    if (await reachable(b.url)) { misses = 0; everOk = true; }
    else if (++misses >= (everOk ? 2 : 1)) show("Your PC is offline or asleep.", "Last address update " + new Date(b.updated * 1000).toLocaleString() + ". Retrying every minute.");
  } catch (e) { show("Can't reach Big Boss right now.", "Retrying every minute."); }
}
function show(a, b) {
  const f = document.querySelector("iframe"); if (f) { f.remove(); current = null; }
  document.getElementById("msg").style.display = "flex";
  document.getElementById("txt").textContent = a; document.getElementById("sub").textContent = b;
  document.getElementById("retry").hidden = false;
}
document.getElementById("retry").onclick = () => { document.getElementById("txt").textContent = "Connecting…"; connect(); };
connect(); setInterval(connect, 60000);
</script>
</body>
</html>
