<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Boss</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Big Boss">
<meta name="theme-color" content="#1c1d20">
<style>
html,body{margin:0;height:100%;background:#1c1d20;color:#f4f4f2;font:15px -apple-system,system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#1c1d20}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#msg img{width:64px;height:64px;border-radius:15px}
#msg small{color:#a2a3a8}
.dot{width:8px;height:8px;border-radius:50%;background:#a2a3a8;display:inline-block;margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="msg"><img src="icon-180.png" alt=""><div><span class="dot"></span><span id="txt">Connecting to Big Boss on your PC…</span></div><small id="sub"></small></div>
<script>
// The bot runs on the owner's PC behind a Cloudflare quick tunnel whose address changes on restart.
// The PC publishes the current address to bot.json; this page always loads the latest one.
let current = null;
async function connect() {
  try {
    const b = await (await fetch("bot.json?t=" + Date.now(), {cache: "no-store"})).json();
    const ok = await fetch(b.url + "/health", {mode: "no-cors", cache: "no-store"}).then(() => true).catch(() => false);  // no-cors: reachability only
    if (!ok) { show("Your PC is offline or asleep.", "Last address update " + new Date(b.updated * 1000).toLocaleString() + ". Retrying…"); return; }
    if (b.url !== current) {
      current = b.url;
      let f = document.querySelector("iframe");
      if (!f) { f = document.createElement("iframe"); document.body.appendChild(f); }
      f.src = b.url + "/phone/";
      document.getElementById("msg").style.display = "none";
    }
  } catch (e) { show("Can't reach Big Boss right now.", "Retrying…"); }
}
function show(a, b) {
  const f = document.querySelector("iframe"); if (f) { f.remove(); current = null; }
  document.getElementById("msg").style.display = "flex";
  document.getElementById("txt").textContent = a; document.getElementById("sub").textContent = b;
}
connect(); setInterval(connect, 60000);
</script>
</body>
</html>
