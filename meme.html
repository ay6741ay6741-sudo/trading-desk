<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme Bot</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meme Bot">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;color:#e6ecf5;font:15px system-ui,-apple-system,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#msg small{color:#7d8aa3}
.dot{width:10px;height:10px;border-radius:50%;background:#ffb648;display:inline-block;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<div id="msg"><div><span class="dot"></span> Connecting to the bot on your PC…</div><small id="sub"></small></div>
<script>
// The bot runs on the owner's PC behind a Cloudflare quick tunnel whose address changes on restart.
// The PC publishes the current address to bot.json; this page always loads the latest one.
let current = null;
async function connect() {
  try {
    const b = await (await fetch("bot.json?t=" + Date.now(), {cache: "no-store"})).json();
    const ok = await fetch(b.url + "/health", {mode: "no-cors", cache: "no-store"}).then(() => true).catch(() => false);  // no-cors: reachability only
    if (!ok) { show("The PC is offline or asleep.", "Last address update " + new Date(b.updated * 1000).toLocaleString() + ". Retrying…"); return; }
    if (b.url !== current) {
      current = b.url;
      let f = document.querySelector("iframe");
      if (!f) { f = document.createElement("iframe"); document.body.appendChild(f); }
      f.src = b.url + "/phone/";
      document.getElementById("msg").style.display = "none";
    }
  } catch (e) { show("Can't reach the bot right now.", "Retrying…"); }
}
function show(a, b) {
  const f = document.querySelector("iframe"); if (f) { f.remove(); current = null; }
  const m = document.getElementById("msg"); m.style.display = "flex";
  m.firstElementChild.innerHTML = '<span class="dot"></span> ' + a; document.getElementById("sub").textContent = b;
}
connect(); setInterval(connect, 60000);
</script>
</body>
</html>
